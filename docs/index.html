<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Set Championships</title>
    <!-- Leaflet must come BEFORE styles.css: it ships `.leaflet-container a` at the
         same specificity as our popup link rules, so source order breaks the tie.
         No `defer` — the inline script below runs during parsing and needs `L`. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header>
        <h1>🎴 Upcoming Set Championships</h1>
    </header>

    <!-- ═══════════════════════════════════════════════════════════
     POSTCODE ENTRY SCREEN
════════════════════════════════════════════════════════════ -->
    <div id="entry-screen">
        <div class="hero">
            <h2>Find events near you</h2>
            <p>Choose your postcode to load upcoming set championship events, sorted by travel time.</p>
        </div>

        <form class="postcode-form" id="postcode-form">
            <select id="postcode-select">
                <option value="">Loading…</option>
            </select>
            <button type="submit">Load</button>
        </form>

        <div id="entry-error" class="error-msg" style="display:none"></div>

        <p style="margin-top:1.5rem;font-size:0.9rem;color:#64748b">
            <a href="watch.html" style="color:#2563eb;font-weight:500">Watch a competition live →</a>
        </p>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
     LOADING
════════════════════════════════════════════════════════════ -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading events…</p>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
     RESULTS SCREEN
════════════════════════════════════════════════════════════ -->
    <div id="results-screen">
        <div class="results-header">
            <h2 id="results-title"></h2>
            <span id="last-updated" style="font-size:0.8rem;color:#94a3b8"></span>
            <button id="change-postcode-btn">Change postcode</button>
        </div>

        <div class="day-nav-wrap">
            <div id="day-nav" class="day-nav" style="display:none"></div>
        </div>

        <div class="content-wrap">
            <div id="type-filter-row" class="type-chip-row" style="display:none"></div>
            <div class="controls">
                <input type="text" id="venue-filter" placeholder="Filter by venue or location…" autocomplete="off">
                <select id="sort-select" class="sort-select">
                    <option value="travel:1">Travel (nearest first)</option>
                    <option value="travel:-1">Travel (farthest first)</option>
                    <option value="venue:1">Venue A→Z</option>
                    <option value="signed_up:-1">Signed up (most first)</option>
                    <option value="last_champ:-1">Previous attendance (most first)</option>
                </select>
                <div class="view-toggle">
                    <button id="btn-table-view" class="toggle-btn">Table</button>
                    <button id="btn-card-view" class="toggle-btn">Cards</button>
                    <button id="btn-map-view" class="toggle-btn">Map</button>
                </div>
                <span id="event-count" class="count-label"></span>
            </div>

            <div id="recent-section" class="day-group">
                <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap">
                    <h3 class="day-heading" style="margin:0">New competitions <span id="recent-count"
                            style="color:#64748b;font-weight:600;font-size:0.82rem"></span></h3>
                    <button id="recent-toggle-btn" class="mini-btn">Hide</button>
                    <span style="font-size:0.85rem;color:#64748b">&mdash; added in the last</span>
                    <select id="new-days-select"
                        style="padding:0.2rem 0.4rem;border:1px solid #cbd5e1;border-radius:4px;font:inherit;font-size:0.85rem;background:#fff;cursor:pointer">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="7">7</option>
                    </select>
                    <span style="font-size:0.85rem;color:#64748b">day(s)</span>
                </div>
                <div id="recent-container"></div>
            </div>

            <div id="cat-fact-section" class="cat-fact-section" style="display:none">
                <div class="cat-fact-inner">
                    <span class="cat-fact-emoji">🐱</span>
                    <p id="cat-fact-text"></p>
                    <button id="cat-fact-btn" class="cat-fact-btn">New fact</button>
                </div>
            </div>

            <!-- Map view. Deliberately a SIBLING of #days-container, which gets its
                 innerHTML replaced on every render — keeping the map outside means the
                 single Leaflet instance is never destroyed and can't leak. -->
            <div id="map-section" style="display:none">
                <!-- Warning sits ABOVE the map: an event that can't be plotted is
                     invisible, so the user must be told without having to scroll past
                     the map to find out. -->
                <p id="map-warning" class="map-warning" style="display:none"></p>
                <div id="map"></div>
                <p id="map-note" class="map-note"></p>
            </div>

            <div id="days-container"></div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  CSV parsing (RFC 4180 — handles quoted fields with commas)
        // ═══════════════════════════════════════════════════════════
        function parseCSV(text) {
            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            if (!lines.length) return [];

            function parseLine(line) {
                const fields = [];
                let i = 0;
                while (i < line.length) {
                    if (line[i] === '"') {
                        // Quoted field
                        let val = '';
                        i++; // skip opening quote
                        while (i < line.length) {
                            if (line[i] === '"' && line[i + 1] === '"') {
                                val += '"'; i += 2;
                            } else if (line[i] === '"') {
                                i++; break;
                            } else {
                                val += line[i++];
                            }
                        }
                        if (line[i] === ',') i++;
                        fields.push(val);
                    } else {
                        const end = line.indexOf(',', i);
                        if (end === -1) {
                            fields.push(line.slice(i));
                            break;
                        }
                        fields.push(line.slice(i, end));
                        i = end + 1;
                    }
                }
                return fields;
            }

            const headers = parseLine(lines[0]);
            const rows = [];
            for (let l = 1; l < lines.length; l++) {
                const line = lines[l].trim();
                if (!line) continue;
                const vals = parseLine(line);
                const obj = {};
                headers.forEach((h, i) => obj[h] = vals[i] ?? '');
                rows.push(obj);
            }
            return rows;
        }

        // ═══════════════════════════════════════════════════════════
        //  Travel time → sortable seconds (N/A → Infinity)
        // ═══════════════════════════════════════════════════════════
        function travelToSeconds(str) {
            if (!str || str === 'N/A') return Infinity;
            let secs = 0;
            const h = str.match(/(\d+)h/);
            const m = str.match(/(\d+)m/);
            if (h) secs += parseInt(h[1]) * 3600;
            if (m) secs += parseInt(m[1]) * 60;
            return (h || m) ? secs : Infinity;
        }

        // ═══════════════════════════════════════════════════════════
        //  Postcode normalisation — uppercase and add space if missing
        // ═══════════════════════════════════════════════════════════
        function normalisePostcode(raw) {
            const clean = raw.trim().toUpperCase().replace(/\s+/g, '');
            if (clean.length < 5) return raw.trim().toUpperCase();
            // Insert space before last 3 chars (standard UK format)
            return clean.slice(0, -3) + ' ' + clean.slice(-3);
        }

        // ═══════════════════════════════════════════════════════════
        //  CSV URL from postcode   e.g.  MK6  →  upcoming_MK6.csv
        // ═══════════════════════════════════════════════════════════
        function csvFilename(postcode) {
            return 'upcoming_' + postcode.replace(/\s+/g, '_') + '.csv';
        }

        // ═══════════════════════════════════════════════════════════
        //  State
        // ═══════════════════════════════════════════════════════════
        let allRows = [];
        let allTypes = [];          // distinct competition types in CSV order
        let activeTypes = new Set(); // currently selected types (all active by default)
        let filterText = '';
        let sortCol = 'travel';
        let sortDir = 1;
        let viewMode = 'table'; // 'table', 'card' or 'map'
        let recentCollapsed = false;

        // ── Map view state ──
        const UK_CENTRE = [54.5, -3.0];
        let venueCoords = null;         // {"MK10 0BA": [lat, lon]} — null until fetched
        let venueCoordsPromise = null;  // in-flight fetch, shared across postcode switches
        let leafletMap = null;          // L.Map — created once, never destroyed
        let markerLayer = null;         // L.LayerGroup — cleared and refilled on every render
        let currentOrigin = '';         // normalised origin postcode, for the home marker
        let selectedDay = null;         // ISO date, or null for all days (map view only)
        // The map auto-fits only once per dataset. After that the user's pan/zoom is
        // theirs to keep — changing day or filters must not yank the view around. The
        // "Fit" control re-arms it on demand.
        let mapNeedsFit = true;
        let lastFitBounds = null;       // bounds of the currently plotted markers, for the Fit control

        // ═══════════════════════════════════════════════════════════
        //  Preferences (localStorage)
        // ═══════════════════════════════════════════════════════════
        const PREFS_KEY = 'playhub-upcoming-prefs';
        function loadPrefs() {
            try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch { return {}; }
        }
        function savePrefs(updates) {
            const p = loadPrefs();
            Object.assign(p, updates);
            localStorage.setItem(PREFS_KEY, JSON.stringify(p));
        }

        // ═══════════════════════════════════════════════════════════
        //  Load CSV and render
        // ═══════════════════════════════════════════════════════════
        async function loadEventData(postcode) {
            const norm = normalisePostcode(postcode);
            const filename = csvFilename(norm);
            currentOrigin = norm;
            selectedDay = null;   // day choice belongs to the previous event set
            mapNeedsFit = true;   // different origin and events — re-fit is wanted here

            showLoading();
            try {
                const resp = await fetch(filename);
                if (!resp.ok) {
                    throw new Error(
                        resp.status === 404
                            ? `No data found for ${norm}. Generate it with: uv run main.py upcoming-set-champs --postcode "${norm}"`
                            : `Failed to load data (HTTP ${resp.status})`
                    );
                }
                const lastModified = resp.headers.get('Last-Modified');
                const text = await resp.text();
                allRows = parseCSV(text);
                if (!allRows.length) throw new Error('CSV file is empty.');

                // Update URL so the page can be bookmarked / shared
                const url = new URL(window.location);
                url.searchParams.set('postcode', norm);
                window.history.replaceState({}, '', url);

                // keep sort preference; don't reset on postcode change
                filterText = '';
                document.getElementById('venue-filter').value = '';
                buildTypeChips();
                document.getElementById('results-title').textContent =
                    `Upcoming events — travelling from ${norm}`;
                const updatedEl = document.getElementById('last-updated');
                if (lastModified) {
                    const d = new Date(lastModified);
                    updatedEl.textContent = `Last change at ${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} ${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
                } else {
                    updatedEl.textContent = '';
                }
                loadVenueCoords();   // warm the cache while the user is on the table
                showResults();
                renderTable();
            } catch (err) {
                showEntry();
                showEntryError(err.message);
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  Map view
        // ═══════════════════════════════════════════════════════════

        // Coordinates are postcode-independent, so this is fetched at most once
        // per page load no matter how many times the origin postcode changes.
        function loadVenueCoords() {
            if (venueCoordsPromise) return venueCoordsPromise;
            venueCoordsPromise = fetch('venue-coords.json')
                .then(r => r.ok ? r.json() : {})
                .then(data => { venueCoords = (data && typeof data === 'object') ? data : {}; })
                .catch(() => { venueCoords = {}; });
            return venueCoordsPromise;
        }

        function mapFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        // Fullscreen can be refused even when document.fullscreenEnabled is true — an
        // embedding page's permissions policy can block it. Swallow the rejection so it
        // doesn't surface as an unhandled promise error, and leave the map usable.
        function toggleMapFullscreen() {
            const el = document.getElementById('map');
            try {
                const result = mapFullscreenElement()
                    ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                    : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                if (result && typeof result.catch === 'function') {
                    result.catch(err => console.warn('Full screen unavailable:', err));
                }
            } catch (err) {
                console.warn('Full screen unavailable:', err);
            }
        }

        // animate:false on programmatic fits — an animated fitBounds depends on the
        // zoom transition completing, which can silently no-op (leaving the map on the
        // old view). Instant framing is also what you want from a "Fit" button. The
        // user's own pan/zoom gestures are unaffected.
        function fitMapToMarkers() {
            if (!leafletMap || !lastFitBounds || !lastFitBounds.length) return;
            leafletMap.fitBounds(L.latLngBounds(lastFitBounds).pad(0.12), { maxZoom: 12, animate: false });
        }

        // Fit + full screen live INSIDE the map as Leaflet controls so they remain
        // usable when the map is fullscreened (anything outside #map is hidden then).
        function addMapControls(map) {
            const supportsFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
            const Extra = L.Control.extend({
                options: { position: 'topleft' },
                onAdd: function () {
                    const bar = L.DomUtil.create('div', 'leaflet-bar map-extra-controls');
                    const button = (label, title, onClick) => {
                        const a = L.DomUtil.create('a', '', bar);
                        a.href = '#';
                        a.innerHTML = label;
                        a.title = title;
                        a.setAttribute('role', 'button');
                        L.DomEvent.on(a, 'click', L.DomEvent.stop);
                        L.DomEvent.on(a, 'click', onClick);
                        return a;
                    };
                    button('Fit', 'Zoom to fit the events currently shown', fitMapToMarkers);
                    if (supportsFullscreen) {
                        const fsBtn = button('⛶', 'Full screen', toggleMapFullscreen);
                        const sync = () => {
                            const on = !!mapFullscreenElement();
                            fsBtn.title = on ? 'Exit full screen' : 'Full screen';
                            fsBtn.classList.toggle('active', on);
                            // The container just changed size — Leaflet caches dimensions.
                            setTimeout(() => map.invalidateSize(), 100);
                        };
                        document.addEventListener('fullscreenchange', sync);
                        document.addEventListener('webkitfullscreenchange', sync);
                    }
                    return bar;
                }
            });
            map.addControl(new Extra());
        }

        function ensureMap() {
            if (leafletMap) return leafletMap;
            if (typeof L === 'undefined') return null;
            leafletMap = L.map('map', { scrollWheelZoom: true }).setView(UK_CENTRE, 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(leafletMap);
            markerLayer = L.layerGroup().addTo(leafletMap);
            addMapControls(leafletMap);
            return leafletMap;
        }

        function groupRowsByVenue(rows) {
            const groups = new Map();
            for (const r of rows) {
                const pc = normalisePostcode(r['Postcode'] || '');
                const key = (r['Venue'] || '') + '|' + pc;
                let g = groups.get(key);
                if (!g) {
                    g = { venue: r['Venue'] || 'Unknown venue', postcode: pc, rows: [] };
                    groups.set(key, g);
                }
                g.rows.push(r);
            }
            return [...groups.values()];
        }

        function venuePopupHtml(g) {
            // Every event in a group shares a venue, so travel time is identical and
            // sortRows() would be a no-op — order by date instead.
            const events = [...g.rows].sort((a, b) => (a['Date'] || '').localeCompare(b['Date'] || ''));
            const travel = events[0]['Travel time'] || '';
            const items = events.map(r => {
                const eid = extractEventId(r['Event link']);
                const links = [];
                if (r['Event link']) links.push(`<a href="${esc(r['Event link'])}" target="_blank" rel="noopener">PlayHub</a>`);
                if (eid) links.push(`<a href="watch.html?id=${eid}">Watch</a>`);
                if (r['Route link']) links.push(`<a href="${esc(r['Route link'])}" target="_blank" rel="noopener">Directions</a>`);
                return `<li class="map-pop-event">
                    <span class="map-pop-date">${esc(formatDate(r['Date']))}</span>
                    ${r['Type'] ? typeBadge(r['Type']) : ''}
                    ${links.length ? `<span class="map-pop-links">${links.join(' · ')}</span>` : ''}
                </li>`;
            }).join('');
            return `<div class="map-popup">
                <div class="map-pop-venue">${esc(g.venue)}</div>
                <div class="map-pop-meta">${esc(g.postcode)}${travel && travel !== 'N/A' ? ' · ' + esc(travel) + ' drive' : ''}</div>
                <ul class="map-pop-list">${items}</ul>
            </div>`;
        }

        function renderMap(rows) {
            const noteEl = document.getElementById('map-note');

            if (venueCoords === null) {
                noteEl.textContent = 'Loading map data…';
                loadVenueCoords().then(() => { if (viewMode === 'map') renderTable(); });
                return;
            }
            const map = ensureMap();
            if (!map) {
                noteEl.textContent = 'The map library could not be loaded. Try the Table or Cards view.';
                return;
            }
            // The container was display:none until applyViewVisibility() ran a moment
            // ago, so Leaflet still has stale dimensions cached. Recompute them before
            // fitBounds, or the fit is calculated against the wrong size.
            map.invalidateSize();
            markerLayer.clearLayers();

            const bounds = [];
            const used = new Set();
            let placedVenues = 0, placedEvents = 0, missingEvents = 0;
            const missingVenues = new Set();

            for (const g of groupRowsByVenue(rows)) {
                const c = venueCoords[g.postcode];
                if (!Array.isArray(c) || c.length !== 2) {
                    missingEvents += g.rows.length;
                    missingVenues.add(g.venue);
                    continue;
                }
                let lat = c[0], lon = c[1], key = lat + ',' + lon;
                // Two venues can share a postcode — nudge duplicates so both stay clickable
                while (used.has(key)) { lat += 0.0004; lon += 0.0004; key = lat + ',' + lon; }
                used.add(key);

                L.circleMarker([lat, lon], {
                    radius: g.rows.length > 1 ? 9 : 7,
                    color: '#1e293b', weight: 1.5,
                    fillColor: '#2563eb', fillOpacity: 0.85
                })
                    .bindPopup(venuePopupHtml(g), { maxWidth: 320, minWidth: 220 })
                    .bindTooltip(`${g.venue} (${g.rows.length})`, { direction: 'top' })
                    .addTo(markerLayer);

                bounds.push([lat, lon]);
                placedVenues++;
                placedEvents += g.rows.length;
            }

            const home = venueCoords[currentOrigin];
            if (Array.isArray(home) && home.length === 2) {
                L.marker(home, {
                    icon: L.divIcon({ className: 'home-pin', html: '🏠', iconSize: [26, 26], iconAnchor: [13, 13] }),
                    zIndexOffset: 1000, keyboard: false
                })
                    .bindPopup(`<div class="map-popup"><div class="map-pop-venue">Your starting point</div>
                        <div class="map-pop-meta">${esc(currentOrigin)}</div></div>`)
                    .addTo(markerLayer);
                bounds.push(home);
            }

            // Only fit on the first render of a dataset (or when the Fit control asks).
            // Re-fitting on every render would move the map out from under the user
            // each time they changed day or typed in the filter box.
            // fitBounds throws on an empty list.
            lastFitBounds = bounds.length ? bounds.slice() : null;
            // Guard on a real container size: a fit computed while the map is collapsed
            // resolves to zoom 0, and consuming the flag then would strand it there for
            // good. Leaving the flag armed means the next render fixes it.
            if (mapNeedsFit && bounds.length && map.getSize().y > 0) {
                map.fitBounds(L.latLngBounds(bounds).pad(0.12), { maxZoom: 12, animate: false });
                mapNeedsFit = false;
            }

            noteEl.textContent = rows.length
                ? `Showing ${placedEvents} event${placedEvents !== 1 ? 's' : ''} at ` +
                  `${placedVenues} venue${placedVenues !== 1 ? 's' : ''}.`
                : 'No events match your filter.';

            // Events without coordinates are INVISIBLE on the map — never let that pass
            // silently. Warn prominently, name the venues, and say where to see them.
            const warnEl = document.getElementById('map-warning');
            if (missingEvents) {
                warnEl.textContent =
                    `⚠ ${missingEvents} event${missingEvents !== 1 ? 's' : ''} not shown on the map — ` +
                    `no location found for ${missingVenues.size} venue` +
                    `${missingVenues.size !== 1 ? 's' : ''}: ${[...missingVenues].sort().join(', ')}. ` +
                    `Switch to Table or Cards view to see ${missingEvents !== 1 ? 'them' : 'it'}.`;
                warnEl.style.display = '';
            } else {
                warnEl.style.display = 'none';
            }
        }

        function applyViewVisibility() {
            const isMap = viewMode === 'map';
            document.getElementById('map-section').style.display = isMap ? '' : 'none';
            document.getElementById('days-container').style.display = isMap ? 'none' : '';
            // renderRecentEvents emits a table unless viewMode is 'card', which would
            // appear as an unrelated table under the map.
            if (isMap) document.getElementById('recent-section').style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════
        //  Render table
        // ═══════════════════════════════════════════════════════════
        function esc(str) {
            return (str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatDate(iso) {
            if (!iso) return 'Unknown date';
            const d = new Date(iso + 'T00:00:00');
            return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function extractEventId(url) {
            const m = (url || '').match(/\/events\/(\d+)/);
            return m ? m[1] : null;
        }

        function typeBadge(type) {
            return type ? `<span class="type-badge">${esc(type)}</span>` : '<span class="badge-na">—</span>';
        }

        function renderRow(r) {
            const travel = r['Travel time'] || 'N/A';
            const routeLink = r['Route link'];
            const eventLink = r['Event link'];
            const lastChampLink = r['Last set champ link'];
            const signedUp = r['Players signed up'];
            const lastChamp = r['Players at last set champ'];
            const postcode = r['Postcode'];
            const price = r['Price'];
            const eventId = extractEventId(eventLink);

            const links = [];
            if (routeLink) links.push(`<a class="link-icon" href="${esc(routeLink)}" target="_blank" rel="noopener" title="Directions">🗺️</a>`);
            if (eventLink) links.push(`<a class="link-icon" href="${esc(eventLink)}" target="_blank" rel="noopener" title="Event page">🔗</a>`);
            if (lastChampLink) links.push(`<a class="link-icon" href="${esc(lastChampLink)}" target="_blank" rel="noopener" title="Last set champ">📋</a>`);
            if (eventId) links.push(`<a class="link-icon" href="watch.html?id=${eventId}" title="Watch live">👁️</a>`);

            return `<tr>
                <td style="font-weight:500">${esc(r['Venue']) || '—'}</td>
                <td>${typeBadge(r['Type'])}</td>

        const COLS = [

        function buildTableHeader() {
            const colgroup = `<colgroup>
                <col><!-- Venue: auto -->
                <col style="width:170px"><!-- Type -->
                <col style="width:90px">
                <col style="width:80px">
                <col style="width:130px">
                <col style="width:65px">
                <col style="width:90px">
                <col style="width:95px">
            </colgroup>`;
            const ths = COLS.map(c => {
                const alignStyle = c.numeric ? ' style="text-align:right"' : '';
                const cls = !c.nosort && sortCol === c.key
                    ? ` class="${sortDir === 1 ? 'sort-asc' : 'sort-desc'}"`
                    : '';
                return `<th${alignStyle}${cls} style="cursor:default">${esc(c.label)}</th>`;
            }).join('');
            return colgroup + `<thead><tr>${ths}</tr></thead>`;
        }

        function sortRows(rows) {
            if (!sortCol) return rows;
            return [...rows].sort((a, b) => {
                let av, bv;
                if (sortCol === 'travel') {
                    av = travelToSeconds(a['Travel time']);
                    bv = travelToSeconds(b['Travel time']);
                } else if (sortCol === 'signed_up') {
                    av = parseInt(a['Players signed up']) || 0;
                    bv = parseInt(b['Players signed up']) || 0;
                } else if (sortCol === 'last_champ') {
                    av = parseInt(a['Players at last set champ']) || 0;
                    bv = parseInt(b['Players at last set champ']) || 0;
                } else if (sortCol === 'venue') {
                    av = (a['Venue'] || '').toLowerCase();
                    bv = (b['Venue'] || '').toLowerCase();
                } else if (sortCol === 'location') {
                    av = (a['Postcode'] || a['Location'] || '').toLowerCase();
                    bv = (b['Postcode'] || b['Location'] || '').toLowerCase();
                }
                if (av < bv) return -sortDir;
                if (av > bv) return sortDir;
                return 0;
            });
        }

        // ═══════════════════════════════════════════════════════════
        //  Competition type filter chips
        // ═══════════════════════════════════════════════════════════
        function buildTypeChips() {
            const row = document.getElementById('type-filter-row');
            allTypes = [...new Set(allRows.map(r => r['Type'] || '').filter(Boolean))];
            // Restore deselected types from prefs; types not in the stored list
            // (including ones first seen in this CSV) default to active
            const hidden = loadPrefs().hiddenTypes || [];
            activeTypes = new Set(allTypes.filter(t => !hidden.includes(t)));
            if (allTypes.length < 2) {
                row.style.display = 'none';
                row.innerHTML = '';
                return;
            }
            row.innerHTML = '<span class="type-chip-label">Type:</span>' + allTypes.map(t =>
                `<button type="button" class="type-chip${activeTypes.has(t) ? ' active' : ''}" data-type="${esc(t)}">${esc(t)}</button>`
            ).join('');
            row.style.display = '';
            row.querySelectorAll('.type-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.type;
                    if (activeTypes.has(t)) activeTypes.delete(t);
                    else activeTypes.add(t);
                    btn.classList.toggle('active', activeTypes.has(t));
                    saveTypePrefs();
                    renderTable();
                });
            });
        }

        function saveTypePrefs() {
            // Keep stored hidden types that aren't in the current CSV (they may
            // belong to another postcode's CSV) and re-derive the rest
            const kept = (loadPrefs().hiddenTypes || []).filter(t => !allTypes.includes(t));
            const hidden = allTypes.filter(t => !activeTypes.has(t));
            savePrefs({ hiddenTypes: [...kept, ...hidden] });
        }

        function typeFiltered(rows) {
            // No chips shown (single type) or everything selected → no filtering
            if (allTypes.length < 2 || activeTypes.size === allTypes.length) return rows;
            return rows.filter(r => activeTypes.has(r['Type'] || ''));
        }

        function renderTable() {
            applyViewVisibility();
            if (viewMode !== 'map') renderRecentEvents(typeFiltered(allRows));
            let rows = typeFiltered(allRows);

            // Filter
            if (filterText) {
                const f = filterText.toLowerCase();
                rows = rows.filter(r =>
                    (r['Venue'] || '').toLowerCase().includes(f) ||
                    (r['Location'] || '').toLowerCase().includes(f)
                );
            }

            const container = document.getElementById('days-container');
            const countEl = document.getElementById('event-count');
            countEl.textContent = `${rows.length} event${rows.length !== 1 ? 's' : ''}`;

            // Map view sits ABOVE the zero-rows early return, so an empty filter still
            // clears the markers instead of leaving stale pins on screen.
            if (viewMode === 'map') {
                // Day options come from the type/text-filtered rows BEFORE the day filter
                // is applied — otherwise picking a day would collapse the dropdown to it.
                const dayDates = [...new Set(rows.map(r => r['Date'] || ''))];
                if (selectedDay && !dayDates.includes(selectedDay)) selectedDay = null;
                renderDayNav(dayDates);

                const mapRows = selectedDay ? rows.filter(r => r['Date'] === selectedDay) : rows;
                countEl.textContent = `${mapRows.length} event${mapRows.length !== 1 ? 's' : ''}`;
                container.innerHTML = '';
                renderMap(mapRows);
                return;
            }

            if (!rows.length) {
                renderDayNav([]);
                container.innerHTML = `<p style="padding:2rem;text-align:center;color:#94a3b8;font-style:italic">No events match your filter</p>`;
                return;
            }

            // Group rows by date, preserving CSV order
            const groups = new Map();
            rows.forEach(r => {
                const date = r['Date'] || '';
                if (!groups.has(date)) groups.set(date, []);
                groups.get(date).push(r);
            });
            const dayDates = Array.from(groups.keys());
            renderDayNav(dayDates);

            const html = [];
            for (const [idx, [date, dayRows]] of Array.from(groups.entries()).entries()) {
                const sorted = sortRows(dayRows);
                if (viewMode === 'card') {
                    html.push(`<div id="day-${idx}" class="day-group">
                        <h3 class="day-heading">${esc(formatDate(date))}</h3>
                        <div class="cards-grid">${sorted.map(renderCard).join('')}</div>
                    </div>`);
                } else {
                    html.push(`<div id="day-${idx}" class="day-group">
                        <h3 class="day-heading">${esc(formatDate(date))}</h3>
                        <div class="table-wrap">
                            <table style="min-width:880px">${buildTableHeader()}<tbody>
                                ${sorted.map(renderRow).join('')}
                            </tbody></table>
                        </div>
                    </div>`);
                }
            }
            container.innerHTML = html.join('');
        }

        // ═══════════════════════════════════════════════════════════
        //  Cat fact
        // ═══════════════════════════════════════════════════════════
        async function loadCatFact(force = false) {
            const prefs = loadPrefs();
            const now = Date.now();
            if (!force && prefs.catFact && prefs.catFactExpiry && now < prefs.catFactExpiry) {
                renderCatFact(prefs.catFact);
                return;
            }
            document.getElementById('cat-fact-text').textContent = 'Fetching a cat fact…';
            document.getElementById('cat-fact-section').style.display = '';
            try {
                const resp = await fetch('https://catfact.ninja/fact');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                savePrefs({ catFact: data.fact, catFactExpiry: now + 60 * 60 * 1000 });
                renderCatFact(data.fact);
            } catch {
                const fallback = loadPrefs().catFact;
                document.getElementById('cat-fact-text').textContent =
                    fallback || 'Could not load a cat fact right now.';
            }
        }

            document.getElementById('cat-fact-text').textContent = fact;

        // ═══════════════════════════════════════════════════════════
        //  Manifest — populate the postcode dropdown
        // ═══════════════════════════════════════════════════════════
        async function loadManifest(preselectPostcode) {
            const sel = document.getElementById('postcode-select');
            try {
                const resp = await fetch('postcodes.json');
                if (!resp.ok) throw new Error();
                const postcodes = await resp.json(); // array of strings like ["MK6_3LP", ...]
                sel.innerHTML = postcodes.map(p => {
                    const display = p.replace('_', ' ');
                    return `<option value="${p}">${display}</option>`;
                }).join('');
                if (preselectPostcode) {
                    // Match against both spaced and underscored forms
                    const target = preselectPostcode.replace(/\s+/g, '_').toUpperCase();
                    const match = [...sel.options].find(o => o.value === target);
                    if (match) {
                        sel.value = match.value;
                        loadEventData(match.value.replace('_', ' '));
                        return;
                    }
                }
            } catch {
                sel.innerHTML = '<option value="">No postcodes available</option>';
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  URL parameter bootstrap — skip entry screen if ?postcode=
        // ═══════════════════════════════════════════════════════════
        (function init() {
            const params = new URLSearchParams(window.location.search);
            const pc = params.get('postcode');
            const prefs = loadPrefs();

            // View: stored pref → device detection fallback. Validate the stored value —
            // the set has three members now, and a stale/garbage entry must not stick.
            const defaultView = window.matchMedia('(max-width: 1024px)').matches ? 'card' : 'table';
            const storedView = ['table', 'card', 'map'].includes(prefs.view) ? prefs.view : null;
            setView(storedView || defaultView);

            // Sort: stored pref → default 'travel:1'
            const sortVal = prefs.sort || 'travel:1';
            document.getElementById('sort-select').value = sortVal;
            const [col, dir] = sortVal.split(':');
            sortCol = col; sortDir = parseInt(dir);

            // Days: stored pref → default '1'
            document.getElementById('new-days-select').value = prefs.days || '1';

            // New competitions collapsed state
            recentCollapsed = !!prefs.recentCollapsed;

            loadManifest(pc || null);
            loadCatFact();
        })();
    </script>
</body>

</html>
